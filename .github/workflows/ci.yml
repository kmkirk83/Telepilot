name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-action:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check action.yml is valid YAML
        run: |
          python3 -c "import yaml, sys; yaml.safe_load(open('action.yml')); print('action.yml is valid YAML ✅')"

      - name: Verify required action fields
        run: |
          python3 - <<'EOF_PY'
          import yaml, sys
          with open('action.yml') as f:
              action = yaml.safe_load(f)
          required = ['name', 'description', 'runs']
          missing = [k for k in required if k not in action]
          if missing:
              print(f'action.yml is missing required fields: {missing}', file=sys.stderr)
              sys.exit(1)
          branding = action.get('branding', {})
          if not branding.get('icon') or not branding.get('color'):
              print('action.yml branding.icon and branding.color are required for Marketplace', file=sys.stderr)
              sys.exit(1)
          print('action.yml structure is valid ✅')
          EOF_PY

  node-quality:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  validate-env-docs:
    name: Validate .env.example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .env.example exists and is non-empty
        run: |
          if [ ! -s ".env.example" ]; then
            echo ".env.example is missing or empty" >&2
            exit 1
          fi
          echo ".env.example is present ✅"

  lint-docs:
    name: Lint Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.39.0

      - name: Run markdownlint
        run: |
          markdownlint README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md SUPPORT.md docs/*.md --config .markdownlint.json

  shellcheck:
    name: ShellCheck (action.yml inline scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml

      - name: Extract and check shell scripts from action.yml
        run: |
          python3 - <<'EOF_PY'
          import yaml, subprocess, tempfile, sys, os
          with open('action.yml') as f:
              action = yaml.safe_load(f)
          steps = action.get('runs', {}).get('steps', [])
          exit_code = 0
          for i, step in enumerate(steps):
              script = step.get('run', '')
              if script:
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.sh', delete=False) as tmp:
                      tmp.write('#!/usr/bin/env bash\n' + script)
                      tmp_path = tmp.name
                  result = subprocess.run(['shellcheck', '--severity=warning', tmp_path], capture_output=True, text=True)
                  if result.returncode != 0:
                      print(f"ShellCheck issues in step {i} ({step.get('name', '?')}):")
                      print(result.stdout)
                      exit_code = 1
                  os.unlink(tmp_path)
          if exit_code == 0:
              print('ShellCheck passed ✅')
          sys.exit(exit_code)
          EOF_PY

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-major-tag:
    name: Update major version tag (vN)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [validate-action, node-quality, validate-env-docs, lint-docs, shellcheck, secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update major version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR}" -m "Update ${MAJOR} tag to ${TAG}"
          git push origin "${MAJOR}" --force
