name: "Telepilot"
description: "Run a bounded AI prompt in GitHub Actions, optionally relay the response to an authorized Telegram chat, and emit an optional signed Clarion event summary."
author: "kmkirk83"

branding:
  icon: "message-circle"
  color: "blue"

inputs:
  prompt:
    description: "Plain-text prompt to send to the configured provider (maximum 12,000 characters after optional context is combined)."
    required: true
  provider:
    description: "Provider adapter identifier. v0 supports only 'openai'."
    required: false
    default: "openai"
  api-key:
    description: "Provider credential. Pass only from GitHub Actions secrets."
    required: true
  api-endpoint:
    description: "OpenAI-compatible chat-completions endpoint."
    required: false
    default: "https://api.openai.com/v1/chat/completions"
  model:
    description: "Provider model identifier."
    required: false
    default: "gpt-4o-mini"
  context:
    description: "Optional caller-supplied text context (maximum 24,000 characters)."
    required: false
    default: ""
  telegram-bot-token:
    description: "Optional Telegram Bot API token. Telegram delivery is disabled unless this and telegram-chat-id are both set."
    required: false
  telegram-chat-id:
    description: "Optional Telegram chat ID for delivery."
    required: false
  telegram-allowed-chat-ids:
    description: "Optional comma-separated allowlist of Telegram chat IDs. When set, telegram-chat-id must be included."
    required: false
    default: ""
  clarion-event-endpoint:
    description: "Optional Clarion endpoint that receives a signed, metadata-only completion summary."
    required: false
  clarion-event-secret:
    description: "Optional HMAC secret for the Clarion event summary. Pass only from GitHub Actions secrets."
    required: false
  clarion-organization-id:
    description: "Clarion organization ID that owns the optional event summary."
    required: false
  clarion-event-required:
    description: "Fail the action when an enabled Clarion event summary cannot be delivered."
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the action on provider or authorized-delivery errors. Defaults to true."
    required: false
    default: "true"
  action-version:
    description: "Version label included in optional Clarion event summaries."
    required: false
    default: "v0.1.0"

outputs:
  response:
    description: "Normalized provider response text."
  provider:
    description: "Provider adapter that generated the response."
  request-id:
    description: "Non-secret correlation ID for troubleshooting."
  telegram-message-id:
    description: "Telegram message ID when optional delivery succeeds."
  clarion-event-status:
    description: "One of disabled, delivered, or failed."

runs:
  using: "composite"
  steps:
    - name: Run Telepilot
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        PROVIDER: ${{ inputs.provider }}
        API_KEY: ${{ inputs.api-key }}
        API_ENDPOINT: ${{ inputs.api-endpoint }}
        MODEL: ${{ inputs.model }}
        CONTEXT: ${{ inputs.context }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}
        TELEGRAM_ALLOWED_CHAT_IDS: ${{ inputs.telegram-allowed-chat-ids }}
        CLARION_EVENT_ENDPOINT: ${{ inputs.clarion-event-endpoint }}
        CLARION_EVENT_SECRET: ${{ inputs.clarion-event-secret }}
        CLARION_ORGANIZATION_ID: ${{ inputs.clarion-organization-id }}
        CLARION_EVENT_REQUIRED: ${{ inputs.clarion-event-required }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        ACTION_VERSION: ${{ inputs.action-version }}
      run: "${{ github.action_path }}/scripts/run-action.sh"
